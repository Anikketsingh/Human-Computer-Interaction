<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:e[...]

<main id="app"></main>

<script>
/* ===== DATA: one entry per assignment. New assignments get appended here. ===== */
const ASSIGNMENTS = [
  {
    "id": "a1",
    "title": "Week 1: Assignment 1",
    "topic": "HCI basics and interaction design",
    "questions": [
      {
        "q": "What does HCI stand for?",
        "options": [
          "Human Computer Integration",
          "Human Computer Interaction",
          "High Computer Intelligence",
          "Human Control Interface"
        ],
        "answer": 1,
        "explain": "HCI is Human Computer Interaction, the study of how people use computers and how systems can be designed around them."
      },
      {
        "q": "Which of the following is a key component of HCI?",
        "options": [
          "User",
          "Processor speed",
          "Internet cable",
          "Battery life"
        ],
        "answer": 0,
        "explain": "HCI centres on the user, the computer system, and the interaction between them. The other options are hardware details."
      },
      {
        "q": "Which is an example of good design?",
        "options": [
          "Confusing navigation",
          "Clear push/pull sign on door",
          "Too many buttons",
          "No feedback"
        ],
        "answer": 1,
        "explain": "A clear push/pull sign tells people what to do at a glance. The other options all make a system harder to use."
      },
      {
        "q": "Digital transformation means:",
        "options": [
          "Converting physical processes into digital systems",
          "Increasing manual work",
          "Removing technology",
          "Using paper forms only"
        ],
        "answer": 0,
        "explain": "Digital transformation moves processes that were physical or manual onto digital systems."
      },
      {
        "q": "Which of the following is NOT a usability factor?",
        "options": [
          "Efficiency",
          "Memorability",
          "Network speed",
          "Satisfaction"
        ],
        "answer": 2,
        "explain": "Usability factors include efficiency, memorability, learnability, errors and satisfaction. Network speed is a technical property, not a usability factor."
      },
      {
        "q": "Which principle ensures users understand possible actions?",
        "options": [
          "Feedback",
          "Affordance",
          "Consistency",
          "Visibility"
        ],
        "answer": 1,
        "explain": "Affordance is the quality of an object or control that signals what you can do with it, like a button that looks pressable."
      },
      {
        "q": "Feedback in interaction design means:",
        "options": [
          "Removing buttons",
          "System response after user action",
          "Increasing storage",
          "Deleting data"
        ],
        "answer": 1,
        "explain": "Feedback is the system showing a response after you act, such as a button state change, a sound or a confirmation message."
      },
      {
        "q": "A cluttered interface leads to:",
        "options": [
          "Better usability",
          "Faster performance",
          "User confusion",
          "Improved satisfaction"
        ],
        "answer": 2,
        "explain": "Too many elements compete for attention, so users struggle to find what matters and get confused."
      },
      {
        "q": "Which of the following best describes interaction design (IxD)?",
        "options": [
          "Designing hardware components",
          "Designing interactive digital systems and experiences",
          "Managing databases",
          "Programming languages"
        ],
        "answer": 1,
        "explain": "IxD is about designing how people interact with digital products and the experience that results."
      },
      {
        "q": "What is the main issue with too many features in an interface?",
        "options": [
          "Improves usability",
          "Reduces cost",
          "Overcomplicates user experience",
          "Improves performance"
        ],
        "answer": 2,
        "explain": "Feature overload makes an interface harder to learn and use, which complicates the user experience."
      }
    ]
  },
  {
    "id": "a2",
    "title": "Week 2: Assignment 2",
    "topic": "UX, accessibility and design teams",
    "questions": [
      {
        "q": "What does UX focus on in interaction design?",
        "options": [
          "Only coding",
          "User's overall experience and satisfaction",
          "Network speed",
          "Hardware cost"
        ],
        "answer": 1,
        "explain": "UX (user experience) is about how a person feels and what they achieve when using a product, not about the technology underneath."
      },
      {
        "q": "Which of the following is a type of design mentioned?",
        "options": [
          "Network design",
          "User interface design",
          "Cable design",
          "Processor design"
        ],
        "answer": 1,
        "explain": "User interface design is a type of design within interaction design. The other options are engineering topics."
      },
      {
        "q": "Inclusivity in design means:",
        "options": [
          "Designing only for experts",
          "Designing for diverse users",
          "Designing for children only",
          "Designing only for fast users"
        ],
        "answer": 1,
        "explain": "Inclusive design accounts for the full range of users, with different abilities, ages, backgrounds and contexts."
      },
      {
        "q": "Which principle ensures elements are easy to find?",
        "options": [
          "Feedback",
          "Visibility",
          "Consistency",
          "Flexibility"
        ],
        "answer": 1,
        "explain": "Visibility means the controls and options a user needs are noticeable and easy to locate."
      },
      {
        "q": "Interaction design helps designers to:",
        "options": [
          "Only reduce cost",
          "Understand user needs and behaviors",
          "Increase hardware size",
          "Remove testing"
        ],
        "answer": 1,
        "explain": "Interaction design is grounded in understanding what users need and how they behave, so designs fit them."
      },
      {
        "q": "Which designer focuses on app structure and navigation?",
        "options": [
          "UI Designer",
          "Information Architect",
          "Motion Designer",
          "Brand Designer"
        ],
        "answer": 1,
        "explain": "An information architect organises content and navigation so people can find their way around an app."
      },
      {
        "q": "Which accessibility feature helps visually impaired users?",
        "options": [
          "Bright colors",
          "Screen readers",
          "Animations",
          "Large storage"
        ],
        "answer": 1,
        "explain": "Screen readers speak on-screen content aloud, which lets visually impaired users operate software."
      },
      {
        "q": "Which principle helps reduce errors and recover from them?",
        "options": [
          "Visibility",
          "Error prevention and recovery",
          "Feedback",
          "Flexibility"
        ],
        "answer": 1,
        "explain": "Error prevention and recovery covers stopping mistakes before they happen and making them easy to undo or fix."
      },
      {
        "q": "Accessibility mainly focuses on:",
        "options": [
          "Cultural diversity",
          "Users with disabilities",
          "Only performance",
          "Only UI design"
        ],
        "answer": 1,
        "explain": "Accessibility is about making products usable by people with disabilities."
      },
      {
        "q": "What is a key challenge in interaction design teams?",
        "options": [
          "Lack of ideas",
          "Difficulty in communication across disciplines",
          "Too few designers",
          "No user data"
        ],
        "answer": 1,
        "explain": "Interaction design teams mix disciplines such as design, engineering and research, so communication across them is hard."
      }
    ]
  }
];

function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
const totalQuestions = () => ASSIGNMENTS.reduce((n, a) => n + a.questions.length, 0);

/* ===== HUB ===== */
function renderHub() {
  run = null;
  const rows = ASSIGNMENTS.map(a => `
    <div class="row">
      <div class="info">
        <span class="eyebrow">${esc(a.topic)}</span>
        <h2>${esc(a.title)}</h2>
        <span class="meta">${a.questions.length} questions</span>
      </div>
      <button class="btn" data-start="${a.id}">Start quiz</button>
    </div>`).join("");
  app.innerHTML = `
    <header class="head">
      <span class="eyebrow">Assignment practice</span>
      <h1>Assignment Quiz Hub</h1>
      <p>Pick one assignment, or run the combined quiz to mix questions from every assignment so far.</p>
    </header>
    <section class="settings" aria-label="Quiz options">
      <label class="setting">
        <span><b>Shuffle question order</b><small>Off keeps the original assignment order.</small></span>
        <span class="switch"><input type="checkbox" id="sq" ${settings.shuffleQ ? "checked" : ""}><span></span></span>
      </label>
      <label class="setting">
        <span><b>Shuffle answer options</b><small>Off keeps the options as they appear in the assignment.</small></span>
        <span class="switch"><input type="checkbox" id="so" ${settings.shuffleO ? "checked" : ""}><span></span></span>
      </label>
    </section>
    <section class="list" aria-label="Quizzes">
      <div class="row combined">
        <div class="info">
          <span class="eyebrow">All assignments</span>
          <h2>Combined Quiz</h2>
          <span class="meta">${totalQuestions()} questions from ${ASSIGNMENTS.length} assignment${ASSIGNMENTS.length === 1 ? "" : "s"}</span>
        </div>
        <button class="btn" data-start="all">Start combined</button>
      </div>
      ${rows}
    </section>
    <p class="empty-note">New assignments are added here as they come in.</p>`;
  document.getElementById("sq").onchange = e => { settings.shuffleQ = e.target.checked; };
  document.getElementById("so").onchange = e => { settings.shuffleO = e.target.checked; };
  app.querySelectorAll("[data-start]").forEach(b => b.onclick = () => startQuiz(b.dataset.start));
}

/* ===== QUIZ ===== */
function startQuiz(id) {
  let items = [];
  const sources = id === "all" ? ASSIGNMENTS : ASSIGNMENTS.filter(a => a.id === id);
  sources.forEach(a => a.questions.forEach((q, i) => items.push({ ...q, src: a.title, num: i + 1 })));
  if (settings.shuffleQ) items = shuffle(items);
  items = items.map(it => {
    let opts = it.options.map((t, i) => ({ t, ok: i === it.answer }));
    if (settings.shuffleO) opts = shuffle(opts);
    return { ...it, options: opts };
  });

  run = {
    id,
    items,
    index: 0,
    score: 0,
    answers: [],
    startedAt: Date.now(),
    done: false,
  };

  renderQuiz();
}

function renderQuiz() {
  const r = run;
  if (!r) return renderHub();

  const q = r.items[r.index];
  const answered = r.answers[r.index];
  const pct = (r.index / r.items.length) * 100;

  app.innerHTML = `
    <div class="topbar">
      <button class="back" type="button" data-back="hub">← Back to hub</button>
      <div class="chips">
        <span class="chip">${r.index + 1}/${r.items.length}</span>
        <span class="chip mono">${Math.round(pct)}% done</span>
      </div>
    </div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <article class="qcard">
      <div class="eyebrow">
        <span>${esc(q.src)}</span>
        <span>Question ${q.num}</span>
      </div>
      <h2>${esc(q.q)}</h2>
      <div class="opts">
        ${q.options.map((opt, i) => `
          <button class="opt ${answered !== undefined ? (opt.ok ? 'right' : (answered === i ? 'wrong' : '')) : ''}" data-choice="${i}" ${answered !== undefined ? 'disabled' : ''}>
            <span class="k">${String.fromCharCode(65 + i)}</span>
            <span class="t">${esc(opt.t || opt)}</span>
            <span class="tag">${answered !== undefined ? (opt.ok ? 'Correct' : (answered === i ? 'Your pick' : '')) : ''}</span>
          </button>
        `).join('')}
      </div>
      ${answered !== undefined ? `<div class="explain"><b>Explanation</b>${esc(q.explain)}</div>` : ''}
      <div class="actions">
        ${answered !== undefined ? `<button class="btn" data-next="next">${r.index === r.items.length - 1 ? 'See results' : 'Next question'}</button>` : ''}
      </div>
    </article>
  `;

  app.querySelector('[data-back="hub"]')?.addEventListener('click', () => renderHub());
  app.querySelectorAll('[data-choice]').forEach(btn => {
    btn.onclick = () => {
      const choice = Number(btn.dataset.choice);
      const isCorrect = q.options[choice].ok;
      r.answers[r.index] = choice;
      if (isCorrect) r.score += 1;
      renderQuiz();
    };
  });
  app.querySelector('[data-next="next"]')?.addEventListener('click', () => {
    r.index += 1;
    if (r.index >= r.items.length) {
      renderResults();
      return;
    }
    renderQuiz();
  });
}

function renderResults() {
  const r = run;
  const total = r.items.length;
  const correct = r.score;
  const pct = Math.round((correct / total) * 100);
  const verdict = pct >= 80 ? 'Excellent work.' : pct >= 60 ? 'Good effort.' : pct >= 40 ? 'You’re getting there.' : 'Keep practising.';

  app.innerHTML = `
    <div class="topbar">
      <button class="back" type="button" data-back="hub">← Back to hub</button>
      <div class="chips">
        <span class="chip">Finished</span>
      </div>
    </div>
    <article class="qcard">
      <div class="score">
        <span class="big">${correct}</span>
        <span class="of">/ ${total}</span>
      </div>
      <p class="verdict">${pct}% • ${verdict}</p>
      <ul class="review">
        ${r.items.map((item, idx) => {
          const selected = r.answers[idx];
          const selectedText = selected === undefined ? 'No answer' : item.options[selected].t || item.options[selected];
          const correctText = item.options.find(opt => opt.ok)?.t || item.options.find(opt => opt.ok);
          const ok = item.options[selected]?.ok;
          return `
            <li>
              <div class="q">${idx + 1}. ${esc(item.q)}</div>
              <div class="line"><b>Your answer:</b> ${esc(selectedText)} <span class="${ok ? 'ok' : 'no'}">${ok ? 'Correct' : 'Incorrect'}</span></div>
              <div class="line"><b>Correct answer:</b> ${esc(correctText)}</div>
            </li>`;
        }).join('')}
      </ul>
      <div class="res-actions">
        <button class="btn" data-repeat="repeat">Retry quiz</button>
        <button class="btn ghost" data-back="hub">Back to hub</button>
      </div>
    </article>
  `;

  app.querySelector('[data-repeat="repeat"]')?.addEventListener('click', () => startQuiz(r.id));
  app.querySelector('[data-back="hub"]')?.addEventListener('click', () => renderHub());
}

const settings = { shuffleQ: false, shuffleO: false };
const app = document.getElementById('app');
let run = null;

renderHub();
</script>
