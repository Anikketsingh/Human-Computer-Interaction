<!-- Added attendance tracker: persists counts in localStorage and shows them in the hub -->
<script>
(function(){
  function getAttendKey(id){ return 'attend_' + id; }
  function getAttendCount(id){ try{ return parseInt(localStorage.getItem(getAttendKey(id)) || '0', 10) || 0; }catch(e){return 0;} }
  function incAttendCount(id){ try{ const k = getAttendKey(id); const n = getAttendCount(id) + 1; localStorage.setItem(k, String(n)); return n; }catch(e){return 0;} }

  // If the original functions exist, wrap them so we increment counts when quizzes start,
  // and update the hub display to include "attended N times".
  const origStart = window.startQuiz;
  const origRender = window.renderHub;

  if(typeof origStart === 'function'){
    window.startQuiz = function(id){
      // increment attendance for the specific quiz id ("all" for combined)
      incAttendCount(id);
      // continue with original behaviour
      return origStart(id);
    };
  }

  // Patch renderHub to add counts into each quiz meta line after original render runs.
  if(typeof origRender === 'function'){
    window.renderHub = function(){
      origRender();
      try{
        // Combined card
        const combinedBtn = document.querySelector('[data-start="all"]');
        if(combinedBtn){
          const cr = combinedBtn.closest('.row');
          const meta = cr && cr.querySelector('.meta');
          if(meta){ const c = getAttendCount('all'); meta.textContent = meta.textContent + ' • attended ' + c + ' time' + (c===1? '':'s'); }
        }
        // Individual assignments
        document.querySelectorAll('.list .row').forEach(row => {
          const btn = row.querySelector('[data-start]');
          if(!btn) return;
          const id = btn.dataset.start;
          if(id === 'all') return; // combined handled already
          const meta = row.querySelector('.meta');
          if(meta){ const c = getAttendCount(id); meta.textContent = meta.textContent + ' • attended ' + c + ' time' + (c===1? '':'s'); }
        });
      }catch(e){ /* ignore DOM patch errors */ }
    };
  }

  // If the app is already mounted, re-render the hub so counts are visible immediately.
  try{ if(window.app && document.getElementById('app') && typeof window.renderHub === 'function') window.renderHub(); }catch(e){}
})();
</script>
