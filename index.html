<style>
/* Layout: one centered column. Hub (settings + quiz list) swaps with the quiz view in the same column. */
:root {
  --bg: #f2f5f7;
  --surface: #ffffff;
  --ink: #14202b;
  --muted: #5a6b7a;
  --line: #d5dde4;
  --accent: #0b5c6b;
  --accent-ink: #ffffff;
  --accent-soft: #dcecef;
  --good: #1a7f45;
  --good-soft: #dff3e6;
  --bad: #b42b2b;
  --bad-soft: #f8e1e1;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171f; --surface: #16222c; --ink: #e6edf2; --muted: #96a8b7; --line: #2a3b49;
    --accent: #6fc3d1; --accent-ink: #082a31; --accent-soft: #17333b;
    --good: #5fd08c; --good-soft: #14301f; --bad: #f08a8a; --bad-soft: #3a1b1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171f; --surface: #16222c; --ink: #e6edf2; --muted: #96a8b7; --line: #2a3b49;
  --accent: #6fc3d1; --accent-ink: #082a31; --accent-soft: #17333b;
  --good: #5fd08c; --good-soft: #14301f; --bad: #f08a8a; --bad-soft: #3a1b1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));

main { max-width: 720px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--font-mono); }

/* Hub */
.head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
.head h1 { font-size: clamp(32px, 7vw, 48px); font-weight: 800; letter-spacing: -.02em; }
.head p { margin: 0; color: var(--muted); max-width: 56ch; }

.settings { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 18px; margin-bottom: 28px; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; }
.setting + .setting { border-top: 1px solid var(--line); }
.setting b { display: block; font-weight: 600; }
.setting small { color: var(--muted); font-size: 14px; }
.switch { position: relative; flex: none; width: 48px; height: 28px; }
.switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.35); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

.list { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.row .info { min-width: 0; flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px; }
.row h2 { font-size: 20px; font-weight: 600; }
.row .meta { color: var(--muted); font-size: 14px; }
.row.combined { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.row.combined .meta, .row.combined .eyebrow { color: var(--accent-ink); opacity: .85; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 10px 18px; font-weight: 600; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }
.row.combined .btn { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); }
.empty-note { margin-top: 20px; color: var(--muted); font-size: 14px; }

/* Quiz */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.back { background: none; border: 0; padding: 6px 0; color: var(--accent); font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); background: var(--surface); }
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 24px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
.qcard .eyebrow { margin-bottom: 10px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.qcard h2 { font-size: clamp(22px, 4.5vw, 28px); font-weight: 600; margin-bottom: 20px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: flex-start; gap: 12px; text-align: left; width: 100%; background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { flex: none; font-family: var(--font-mono); font-size: 13px; width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.opt .t { min-width: 0; flex: 1; padding-top: 2px; overflow-wrap: anywhere; }
.opt .tag { flex: none; font-family: var(--font-mono); font-size: 12px; padding-top: 4px; }
.opt:disabled { cursor: default; }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.right .tag { color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt.wrong .tag { color: var(--bad); }
.explain { margin-top: 18px; padding: 14px 16px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; font-size: 15px; }
.explain b { display: block; margin-bottom: 2px; }
.actions { display: flex; justify-content: flex-end; margin-top: 18px; }

/* Results */
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 6px 0 4px; }
.score .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(56px, 14vw, 88px); line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.score .of { font-family: var(--font-mono); color: var(--muted); font-size: 18px; }
.verdict { color: var(--muted); margin: 0 0 20px; }
.review { display: flex; flex-direction: column; gap: 10px; margin: 24px 0; padding: 0; list-style: none; }
.review li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.review .q { font-weight: 600; margin-bottom: 6px; }
.review .line { font-size: 14px; color: var(--muted); }
.review .line b { color: var(--ink); font-weight: 500; }
.review .ok { color: var(--good); font-family: var(--font-mono); font-size: 12px; }
.review .no { color: var(--bad); font-family: var(--font-mono); font-size: 12px; }
.res-actions { display: flex; gap: 10px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

        <span class="meta">${a.questions.length} questions</span>
      </div>
      <button class="btn" data-start="${a.id}">Start quiz</button>
    </div>`).join("");
  app.innerHTML = `
    <header class="head">
      <span class="eyebrow">Assignment practice</span>
      <h1>Assignment Quiz Hub</h1>
      <p>Pick one assignment, or run the combined quiz to mix questions from every assignment so far.</p>
    </header>
    <section class="settings" aria-label="Quiz options">
      <label class="setting">
        <span><b>Shuffle question order</b><small>Off keeps the original assignment order.</small></span>
        <span class="switch"><input type="checkbox" id="sq" ${settings.shuffleQ ? "checked" : ""}><span></span></span>
      </label>
      <label class="setting">
        <span><b>Shuffle answer options</b><small>Off keeps the options as they appear in the assignment.</small></span>
        <span class="switch"><input type="checkbox" id="so" ${settings.shuffleO ? "checked" : ""}><span></span></span>
      </label>
    </section>
    <section class="list" aria-label="Quizzes">
      <div class="row combined">
        <div class="info">
          <span class="eyebrow">All assignments</span>
          <h2>Combined Quiz</h2>
          <span class="meta">${totalQuestions()} questions from ${ASSIGNMENTS.length} assignment${ASSIGNMENTS.length === 1 ? "" : "s"}</span>
        </div>
        <button class="btn" data-start="all">Start combined</button>
      </div>
      ${rows}
    </section>
    <p class="empty-note">New assignments are added here as they come in.</p>`;
  document.getElementById("sq").onchange = e => { settings.shuffleQ = e.target.checked; };
  document.getElementById("so").onchange = e => { settings.shuffleO = e.target.checked; };
  app.querySelectorAll("[data-start]").forEach(b => b.onclick = () => startQuiz(b.dataset.start));
}

/* ===== QUIZ ===== */
function startQuiz(id) {
  let items = [];
  const sources = id === "all" ? ASSIGNMENTS : ASSIGNMENTS.filter(a => a.id === id);
  sources.forEach(a => a.questions.forEach((q, i) => items.push({ ...q, src: a.title, num: i + 1 })));
  if (settings.shuffleQ) items = shuffle(items);
  items = items.map(it => {
    let opts = it.options.map((t, i) => ({ t, ok: i === it.answer }));
    if (settings.shuffleO) opts = shuffle(opts);
    return { ...it, opts };
  });
  run = {
    title: id === "all" ? "Combined Quiz" : sources[0].title,
    combined: id === "all", items, idx: 0, picked: null, results: [],
  };
  renderQuestion();
}

function chipsHtml() {
  const c = [];
  c.push(`<span class="chip">${settings.shuffleQ ? "Shuffled questions" : "Original order"}</span>`);
  if (settings.shuffleO) c.push(`<span class="chip">Shuffled options</span>`);
  return c.join("");
}

function renderQuestion() {
  const it = run.items[run.idx];
  const n = run.items.length;
  const answered = run.picked !== null;
  const opts = it.opts.map((o, i) => {
    let cls = "", tag = "";
    if (answered) {
      if (o.ok) { cls = "right"; tag = "Correct"; }
      else if (i === run.picked) { cls = "wrong"; tag = "Your answer"; }
    }
    return `<button class="opt ${cls}" data-i="${i}" ${answered ? "disabled" : ""}>
      <span class="k">${LETTERS[i]}</span><span class="t">${esc(o.t)}</span><span class="tag">${tag}</span></button>`;
  }).join("");
  const last = run.idx === n - 1;
  app.innerHTML = `
    <div class="topbar">
      <button class="back" id="back">&larr; All quizzes</button>
      <div class="chips">${chipsHtml()}</div>
    </div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${run.idx + (answered ? 1 : 0)}"><i style="width:${((run.idx + (answered ? 1 : 0)) / n) * 100}%"></i></div>
    <article class="qcard">
      <div class="eyebrow"><span>${esc(run.title)} &middot; Question ${run.idx + 1} of ${n}</span>${run.combined ? `<span>${esc(it.src)}, Q${it.num}</span>` : ""}</div>
      <h2>${esc(it.q)}</h2>
      <div class="opts">${opts}</div>
      ${answered ? `<div class="explain"><b>${it.opts[run.picked].ok ? "Correct." : "Not quite."}</b>${esc(it.explain)}</div>
      <div class="actions"><button class="btn" id="next">${last ? "See results" : "Next question"}</button></div>` : ""}
    </article>`;
  document.getElementById("back").onclick = renderHub;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (run.picked !== null) return;
    run.picked = +b.dataset.i;
    run.results.push({ item: it, picked: run.picked });
    renderQuestion();
    const nx = document.getElementById("next"); if (nx) nx.focus();
  });
  const nx = document.getElementById("next");
  if (nx) nx.onclick = () => {
    if (last) return renderResults();
    run.idx++; run.picked = null; renderQuestion();
    window.scrollTo(0, 0);
  };
}

function renderResults() {
  const n = run.items.length;
  const score = run.results.filter(r => r.item.opts[r.picked].ok).length;
  const pct = Math.round((score / n) * 100);
  const verdict = pct === 100 ? "Perfect score." : pct >= 70 ? "Solid. Review the misses below." : "Worth another pass. Review the answers below, then retake.";
  const review = run.results.map(r => {
    const ok = r.item.opts[r.picked].ok;
    const right = r.item.opts.find(o => o.ok).t;
    return `<li>
      <div class="q">${esc(r.item.q)}</div>
      <div class="line"><span class="${ok ? "ok" : "no"}">${ok ? "CORRECT" : "WRONG"}</span> &nbsp;You chose: <b>${esc(r.item.opts[r.picked].t)}</b></div>
      ${ok ? "" : `<div class="line">Correct answer: <b>${esc(right)}</b></div>`}
      ${run.combined ? `<div class="line">${esc(r.item.src)}, Q${r.item.num}</div>` : ""}
    </li>`;
  }).join("");
  app.innerHTML = `
    <div class="topbar"><button class="back" id="back">&larr; All quizzes</button><div class="chips">${chipsHtml()}</div></div>
    <span class="eyebrow">${esc(run.title)} &middot; Results</span>
    <div class="score"><span class="big">${score}</span><span class="of">/ ${n} &middot; ${pct}%</span></div>
    <p class="verdict">${verdict}</p>
    <div class="res-actions">
      <button class="btn" id="retake">Retake quiz</button>
      <button class="btn ghost" id="hub">Back to all quizzes</button>
    </div>
    <ul class="review">${review}</ul>`;
  document.getElementById("back").onclick = renderHub;
  document.getElementById("hub").onclick = renderHub;
  document.getElementById("retake").onclick = () => startQuiz(run.combined ? "all" : ASSIGNMENTS.find(a => a.title === run.title).id);
  window.scrollTo(0, 0);
}

renderHub();
</script>

</body></html>
